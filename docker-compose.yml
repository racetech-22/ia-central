services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ia_central}
      POSTGRES_USER: ${POSTGRES_USER:-ia_central}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    # Channel layer de Channels (ADR-025 §9.7, ADR-026) — solo ruteo de
    # conexiones vivas entre consumers, nada durable acá (ver ADR-025 §9.7:
    # perderlo entero corta conexiones en curso pero no pierde datos, fuera
    # del alcance del backup de ADR-004). Sin ports: — solo red interna,
    # mismo criterio que corrigió la exposición de db/web (enmienda
    # 2026-08-02 a ADR-003).
    image: redis:8.10.0
    restart: unless-stopped

  web:
    build: .
    restart: unless-stopped
    # daphne en vez de runserver (ADR-025 §9.7, ADR-026) — ProtocolTypeRouter
    # de core/asgi.py, sin rutas de websocket todavía. Escucha 0.0.0.0:8000
    # dentro del contenedor; el mapeo al host sigue siendo solo 127.0.0.1.
    command: ["daphne", "-b", "0.0.0.0", "-p", "8000", "core.asgi:application"]
    env_file:
      - .env
    depends_on:
      - db
      - redis
    volumes:
      - .:/app
    ports:
      - "127.0.0.1:8000:8000"

  admin-tasks:
    # Misma imagen que `web` (mismo Dockerfile, mismo código, mismas
    # dependencias) — ver ADR-023. Nunca toca el socket ni la API de Docker;
    # a diferencia de docker-proxy/ADR-022, esto no es una alternativa al
    # aislamiento por permisos de Docker, es evitar Docker por completo para
    # run_migrations/run_tests.
    build: .
    restart: unless-stopped
    command: ["python", "admin_tasks_server.py"]
    env_file:
      - .env
    depends_on:
      - db
    # Sin ports: — solo alcanzable por la red interna de Docker Compose.
    # El token de ADMIN_TASKS_TOKEN (ver .env/env.example) es defensa en
    # profundidad además de este aislamiento de red.

  litellm:
    image: ghcr.io/berriai/litellm:v1.83.14-stable
    restart: always
    env_file:
      - .env
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:4000/health/liveliness').status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.4.2
    restart: always
    privileged: true
    environment:
      # Todo lo no listado acá queda en su default (0/deshabilitado) — ver
      # ADR-022. Solo se habilita lo estrictamente necesario para
      # restart_web(): reiniciar un contenedor ya existente por nombre fijo.
      # Deliberadamente NO se habilita CONTAINERS (expondría crear/borrar
      # contenedores, no solo exec/restart — ver ADR-022, motivo por el que
      # run_migrations/run_tests quedan fuera de esta entrega) ni IMAGES,
      # VOLUMES, BUILD, EXEC, ni ningún otro.
      POST: 1
      ALLOW_RESTARTS: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # Sin ports: — solo alcanzable por la red interna de Docker, nunca
    # publicado al host (a diferencia de ntfy, que sí lo necesita).

  orchestrator:
    build:
      context: ./orchestrator
      args:
        ORCHESTRATOR_UID: ${ORCHESTRATOR_UID:-1001}
    restart: always
    depends_on:
      - docker-proxy
      - admin-tasks
    environment:
      PYTHONPATH: /app
      # El SDK de docker (orchestrator/tools o mcp_servers/django_project)
      # habla con el proxy, nunca con /var/run/docker.sock directo — ver
      # ADR-022.
      DOCKER_HOST: tcp://docker-proxy:2375
      # Mismo valor que el de admin-tasks (ambos leen de .env) — ver ADR-023.
      ADMIN_TASKS_TOKEN: ${ADMIN_TASKS_TOKEN}
    volumes:
      # Credencial de suscripción de Claude Code, solo lectura (ver ADR-016,
      # ADR-017, ADR-021). El UID del usuario del contenedor (build arg de
      # arriba) tiene que coincidir con el dueño real de este archivo en el
      # host, o el proceso ve "Permission denied" (el archivo es modo 600).
      # ORCHESTRATOR_CREDENTIALS_PATH es variable propia del proyecto, no
      # ${HOME} del usuario que corre `docker compose` — mismo patrón que
      # ORCHESTRATOR_UID, ver env.example.
      - ${ORCHESTRATOR_CREDENTIALS_PATH:-/home/fernando/.claude/.credentials.json}:/home/orchestrator/.claude/.credentials.json:ro
      # Repo completo en solo lectura: es lo único que necesita el MCP server
      # de mcp_servers/django_project para que git_status/read_file
      # funcionen. Nada de socket de Docker, nada de escritura desde acá.
      - .:/app:ro
    # Sin lógica de negocio, sin disparador automático (cron/scheduler) — ver
    # ADR-021. Este servicio solo prueba el cableado: se invoca a mano vía
    # `docker compose exec orchestrator python -c "from orchestrator import run; ..."`.

  ntfy:
    image: binwiederhier/ntfy:v2.26.3
    restart: always
    command: ["serve"]
    # Nginx corre en el host, fuera de Docker (ADR-003), y necesita alcanzar
    # este servicio para proxificar ntfy.aicentral.network - a diferencia de
    # litellm (que solo otros contenedores necesitan alcanzar), acá hace
    # falta publicar el puerto. Se limita a 127.0.0.1 (no 0.0.0.0): alcanzable
    # por Nginx en el mismo host, no expuesto directo a la interfaz pública.
    ports:
      - "127.0.0.1:2586:80"
    volumes:
      - ./ntfy/server.yml:/etc/ntfy/server.yml:ro
      - ntfy_lib:/var/lib/ntfy
      - ntfy_cache:/var/cache/ntfy
    healthcheck:
      test: ["CMD", "wget", "-q", "--tries=1", "-O", "-", "http://localhost/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  postgres_data:
  ntfy_lib:
  ntfy_cache:
