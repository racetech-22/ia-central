    resumen: "naciendo pantalla por pantalla"
    estado: pendiente
    pilar: 4
    fase: 5
    adrs: [ADR-013, ADR-024]

  - id: pilar5_multimodelo_debate
    nombre: "Multi-modelo con debate"
    resumen: "la pieza más compleja, al final"
    estado: pendiente
    pilar: 5
    fase: 4
    adrs: [ADR-012, ADR-024]

decisiones_abiertas:
  - id: pantalla_conectar_proyecto
    texto: >-
      Pantalla exacta del panel para "conectar proyecto nuevo": no diseñada;
      debe cubrir instalación/autenticación de cualquier agente del catálogo
      (ADR-027) y, para destinos externos, el aislamiento de proceso que
      ADR-028 dejó fuera de su alcance.
    adr: ADR-025
    depende_de: "diseño de UI (Fase 5, cuando exista el panel)"

  - id: modelo_datos_chat_consultor_ejecutor
    texto: "Modelo de datos de Chat/sesión con Consultor y Ejecutor como piezas separadas."
    adr: ADR-025
    depende_de: "diseño técnico"

  - id: esquema_solicitud_permiso_v1
    texto: "Esquema real de SolicitudPermiso sobre los campos de session/request_permission v1."
    adr: ADR-025
    depende_de: "diseño técnico"

  - id: aislamiento_ejecutor_destinos_externos
    texto: >-
      Aislamiento de proceso del Ejecutor para destinos externos — ADR-028
      solo resuelve el caso nativo, depende de cómo se instale el agente en
      cada destino.
    adr: ADR-025
    depende_de: "cómo se instale el agente en cada destino externo"

  - id: verificacion_permisos_por_agente
    texto: >-
      Verificación por agente del catálogo: cuáles llaman a
      session/request_permission con disciplina real, y si alguno tiene hook
      equivalente a ADR-007.
    adr: ADR-025
    depende_de: "verificación empírica contra cada agente"

  - id: acp_directo_o_via_goose
    texto: "Si conviene que IA CENTRAL hable ACP directamente o a través de una implementación como Goose."
    adr: ADR-027
    depende_de: "decisión de diseño"

  - id: can_use_tool_sin_sdk
    texto: "Qué pasa con can_use_tool de ADR-025 punto 1 si el ejecutor deja de ser el Claude Agent SDK."
    adr: ADR-027
    depende_de: "reevaluación técnica"

  - id: agentes_que_cumplen_filtro_catalogo
    texto: "Qué agentes concretos cumplen el filtro de selección de la enmienda 2026-08-06 a ADR-027."
    adr: ADR-027
    depende_de: "verificación empírica"

  - id: metrica_comparacion_agente_modelo
    texto: >-
      Qué métrica registra la sala por iteración para comparar combinaciones
      agente+modelo, más allá del costo que ya entrega usage_update.
    adr: ADR-027
    depende_de: "diseño técnico"

  - id: sdk_python_alcanza_o_proceso_separado
    texto: "Si la librería de Python de ACP alcanza, o si el ejecutor necesita un proceso separado en otro lenguaje."
    adr: ADR-027
    depende_de: "maduración del SDK / verificación técnica"

  - id: catalogo_config_o_curado
    texto: "Si el catálogo de agentes se define por configuración de despliegue o por lista curada en el repo."
    adr: ADR-027
    depende_de: "decisión de Fernando"

  - id: escritura_fuera_arbol_trabajo_ejecutor
    texto: "Escritura legítima del Ejecutor fuera de su propio árbol de trabajo: declarado fuera de alcance de ADR-028, sin resolver."
    adr: ADR-028
    depende_de: "diseño técnico"

  - id: granularidad_contenedor_ejecutor
    texto: "Granularidad del contenedor del Ejecutor (uno por proyecto o uno por chat) y quién gestiona su ciclo de vida."
    adr: ADR-028
    depende_de: "diseño técnico"

  - id: ubicacion_cliente_acp
    texto: "Dónde corre el proceso cliente ACP del lado de IA CENTRAL: dentro de web/Daphne o como servicio propio."
    adr: ADR-028
    depende_de: "diseño técnico"
