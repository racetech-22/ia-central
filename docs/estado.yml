# Fuente estructurada del mapa de ruta (/mapa/, apps/adminpanel/views.py). Ver ADR-029.
#
# "estado" es siempre uno de estos tres valores ASCII: construido | disenado | pendiente.
# Las etiquetas con acentos ("diseñado, sin código") viven en el renderizador
# (apps/adminpanel/estado.py), no acá — así el archivo no depende de encoding.
#
# Antes de commitear un cambio a este archivo: .githooks/pre-commit corre
# "docker compose run --rm web python manage.py validar_estado", que bloquea
# el commit si el esquema no cierra, si alguna ADR referenciada no existe como
# archivo real en docs/decisiones/, o si a una pieza "construido" le falta
# algún archivo declarado en "artefactos". El campo "prueba" es solo
# informativo: ni el hook ni la suite lo ejecutan (ver ADR-029, decisión 5 y
# aclaración 2).

piezas:
  # --- Base construida: piezas de infraestructura previas al modelo de 5
  # pilares de ADR-024 (2026-08-03), por eso pilar: base en vez de un número.

  - id: infraestructura_docker_tls
    nombre: "Infraestructura"
    resumen: "Docker y TLS"
    estado: construido
    pilar: base
    fase: 2
    adrs: [ADR-002, ADR-003]
    artefactos: [docker-compose.yml, Dockerfile]
    prueba: "docker compose run --rm web python manage.py check"
    construido_el: 2026-07-30

  - id: backups_postgres_sync
    nombre: "Backups"
    resumen: "pg_dump diario + sync a Drive"
    estado: construido
    pilar: base
    fase: 2
    adrs: [ADR-004, ADR-005]
    artefactos: [scripts/backup_postgres.sh]
    prueba: "bash scripts/backup_postgres.sh"
    construido_el: 2026-07-30

  - id: auditorias_automaticas
    nombre: "Auditorías"
    resumen: "memoria + ADR, automáticas"
    estado: construido
    pilar: base
    fase: 2
    adrs: [ADR-008, ADR-014, ADR-018]
    artefactos: [scripts/memory_audit.sh, scripts/adr_audit.sh]
    prueba: "bash scripts/adr_audit.sh"
    construido_el: 2026-08-02

  - id: notificaciones_ntfy
    nombre: "Notificaciones"
    resumen: "ntfy autohospedado"
    estado: construido
    pilar: base
    fase: 2
    adrs: [ADR-018]
    artefactos: [docker-compose.yml]
    prueba: null
    construido_el: 2026-08-02

  - id: mcp_server_tools
    nombre: "MCP server"
    resumen: "5 tools"
    estado: construido
    pilar: base
    fase: 3
    adrs: [ADR-020, ADR-022, ADR-023]
    artefactos:
      - mcp_servers/django_project/tools.py
      - mcp_servers/django_project/security.py
      - mcp_servers/django_project/server.py
    prueba: "pytest mcp_servers/django_project/tests/ -v"
    construido_el: 2026-08-03

  - id: orquestador_sin_shell
    nombre: "Orquestador"
    resumen: "sin shell"
    estado: construido
    pilar: base
    fase: 3
    adrs: [ADR-015, ADR-016, ADR-017, ADR-021]
    artefactos: [orchestrator/orchestrator.py]
    prueba: >-
      docker compose exec orchestrator python -c
      "from orchestrator import run; print(run('responde solo PONG'))"
    construido_el: 2026-08-03

  - id: litellm_gateway
    nombre: "LiteLLM"
    resumen: "gateway de modelos"
    estado: construido
    pilar: base
    fase: 3
    adrs: [ADR-012]
    artefactos: [litellm/config.yaml]
    prueba: null
    construido_el: 2026-08-01

  - id: sidecar_admin_tasks
    nombre: "admin-tasks"
    resumen: "sidecar, sin Docker"
    estado: construido
    pilar: base
    fase: 3
    adrs: [ADR-023]
    artefactos: [admin_tasks_server.py]
    prueba: null
    construido_el: 2026-08-03

  - id: proxy_docker
    nombre: "Proxy de Docker"
    resumen: "docker-socket-proxy"
    estado: construido
    pilar: base
    fase: 3
    adrs: [ADR-022]
    artefactos: [docker-compose.yml]
    prueba: null
    construido_el: 2026-08-03

  # --- Pilar 1: Sala de discusión y memoria básica (ADR-024, ADR-025).
  # Desglosado en subtareas porque es el pilar en curso — el resto (2-5)
  # todavía no tiene desglose propio, son una sola pieza cada uno.

  - id: pilar1_modelo_datos
    nombre: "Modelo de datos"
    resumen: "Proyecto, Chat, historial, permisos"
